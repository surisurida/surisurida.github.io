name: Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false   # 배포 도중 취소되지 않도록 끝날 때까지 기다린다.

jobs:
  build:
    # ubuntu-latest가 가리키는 이미지가 바뀌어도 그대로 돌도록 버전을 고정한다.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # 테마의 '마지막 수정일' 표시용 git 기록
          persist-credentials: false   # 빌드 단계에서 저장소 토큰을 남기지 않는다.

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm docs:build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: src/.vuepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
